name: Dual-strategy PR review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  submit-wait-and-comment:
    # Repository secrets are intentionally unavailable to pull_request events from
    # forks. Do not replace this with pull_request_target: that would run
    # untrusted PR content with write credentials.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out approved review policies
        uses: actions/checkout@v4
        with:
          # Never let a PR change the policy used to review itself.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: review-specs

      - name: Detect initial policy bootstrap
        id: policies
        shell: bash
        run: |
          if [[ -s review-specs/general.md && -s review-specs/security.md ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            # The PR that first introduces this workflow also introduces the
            # immutable policies. They become available after it is merged.
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Review policies are not on the default branch yet; skipping bootstrap PR.'
          fi

      - name: Submit the immutable review task
        id: submit
        if: ${{ steps.policies.outputs.available == 'true' }}
        env:
          PR_SERVER_URL: ${{ secrets.PR_SERVER_URL }}
          PR_SERVER_API_KEY: ${{ secrets.PR_SERVER_API_KEY }}
          REPOSITORY: https://github.com/${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PR_SERVER_URL" || -z "$PR_SERVER_API_KEY" ]]; then
            echo "Missing required secrets: PR_SERVER_URL and PR_SERVER_API_KEY."
            exit 1
          fi

          payload="$(jq -n \
            --arg repository "$REPOSITORY" \
            --argjson pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --rawfile general_spec review-specs/general.md \
            --rawfile security_spec review-specs/security.md \
            '{
              repository: $repository,
              pr_number: $pr_number,
              head_sha: $head_sha,
              reviews: [
                {id: "general", spec: $general_spec},
                {id: "security", spec: $security_spec}
              ]
            }')"

          response="$(curl --fail-with-body --silent --show-error \
            --request POST "${PR_SERVER_URL%/}/v1/pr-reviews" \
            --header "Authorization: Bearer ${PR_SERVER_API_KEY}" \
            --header 'Content-Type: application/json' \
            --header "Idempotency-Key: ${GITHUB_REPOSITORY}:${PR_NUMBER}:${HEAD_SHA}" \
            --data "$payload")"
          job_id="$(jq -er '.job_id' <<<"$response")"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Poll and validate both strategy results
        id: result
        if: ${{ steps.policies.outputs.available == 'true' }}
        env:
          PR_SERVER_URL: ${{ secrets.PR_SERVER_URL }}
          PR_SERVER_API_KEY: ${{ secrets.PR_SERVER_API_KEY }}
          JOB_ID: ${{ steps.submit.outputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          result_file="$RUNNER_TEMP/pr-review-result.json"
          for attempt in {1..120}; do
            response="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${PR_SERVER_API_KEY}" \
              "${PR_SERVER_URL%/}/v1/pr-reviews/${JOB_ID}")"
            status="$(jq -er '.status' <<<"$response")"
            echo "Attempt ${attempt}: ${status}"

            case "$status" in
              completed)
                printf '%s' "$response" > "$result_file"
                break
                ;;
              partial_failed|failed)
                echo "$response" | jq .
                exit 1
                ;;
              queued|running)
                sleep 10
                ;;
              *)
                echo "Unexpected PR Server response: $response"
                exit 1
                ;;
            esac
          done

          if [[ ! -s "$result_file" ]]; then
            echo "Timed out waiting for PR Server task ${JOB_ID}."
            exit 1
          fi
          jq -e '
            .status == "completed" and
            ([.reviews[] |
              select((.id == "general" or .id == "security") and
                     .status == "completed" and
                     (.body | type == "string" and length > 0))] | length == 2)
          ' "$result_file" >/dev/null
          echo "result_file=$result_file" >> "$GITHUB_OUTPUT"

      - name: Create or update the two PR comments
        if: ${{ steps.policies.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT_FILE: ${{ steps.result.outputs.result_file }}
        shell: bash
        run: |
          set -euo pipefail
          for review_id in general security; do
            case "$review_id" in
              general) title='通用代码评审' ;;
              security) title='安全代码评审' ;;
            esac

            result="$(jq -er --arg id "$review_id" '.reviews[] | select(.id == $id) | .body' "$RESULT_FILE")"
            marker="<!-- pr-review-server:${review_id}:${HEAD_SHA} -->"
            payload_file="$RUNNER_TEMP/${review_id}-comment.json"
            jq -n \
              --arg marker "$marker" \
              --arg title "$title" \
              --arg sha "$HEAD_SHA" \
              --arg result "$result" \
              '{body: ($marker + "\n## " + $title + "\n\n评审提交：`" + $sha + "`\n\n" + $result)}' \
              > "$payload_file"

            existing_comment_id="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq ".[] | select(.body | contains(\"${marker}\")) | .id" \
              | head -n 1 || true)"
            if [[ -n "$existing_comment_id" ]]; then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" \
                --input "$payload_file" >/dev/null
            else
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                --input "$payload_file" >/dev/null
            fi
          done
